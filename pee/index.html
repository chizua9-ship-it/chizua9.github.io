<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>おかしな色塗りバトル</title>
<style>
@font-face{font-family:Aka;src:url(AkazukinPOP.otf)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:480px;font-family:Aka,sans-serif;background:#fff8ee;color:#444;padding:8px}
button,select,input{font:inherit}
button{border:0;border-radius:10px;background:#ff8fab;color:#fff;padding:10px 14px;margin:3px}
.card{background:#fff;border-radius:14px;padding:10px;margin:8px 0;box-shadow:0 2px 6px #0002}
#hd{display:flex;gap:6px}
.chip{flex:1;border-radius:10px;color:#fff;text-align:center;padding:4px;opacity:.6;font-size:15px}
.chip.on{opacity:1;outline:4px solid #333;transform:scale(1.05)}
#g{display:grid;gap:2px;background:#ccc;padding:2px;border-radius:8px}
.c{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden}
.c img.p{width:88%;height:88%;object-fit:contain}
.c b{position:absolute;right:0;bottom:0;color:#fff;font-size:11px;padding:0 3px;border-radius:4px 0 0 0}
.sh::after{content:'';position:absolute;inset:0;background:#0007;z-index:1}
.c b{z-index:2}
.ch{box-shadow:inset 0 0 0 3px #fff}.pvc{box-shadow:inset 0 0 0 4px gold;animation:bl .7s infinite alternate}@keyframes bl{to{filter:brightness(1.3)}}
.v{box-shadow:inset 0 0 0 3px #fffb}.v2{box-shadow:inset 0 0 0 4px gold}
.lk{position:absolute;inset:0;margin:auto;width:75%;height:75%;object-fit:contain;z-index:3}
.lt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;font-size:20px}
#tr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pc{background:#fff;border:3px solid #ddd;border-radius:10px;padding:2px;font-size:11px;text-align:center;color:#444;margin:0}
.pc img{width:100%;aspect-ratio:1;object-fit:contain}
.pc.sel{border-color:#ff5d8f;background:#ffe3ec}.pc.used{opacity:.25}
summary{cursor:pointer}
#rg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px}
.rb{text-align:center}.rm{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#ccc;padding:1px;margin:2px auto;width:120px}
.rm i{aspect-ratio:1;background:#fff;font-style:normal;font-size:8px;line-height:15px}
.rm .me{background:#ffd24d}.rm .at{background:#ff6b81}.rm .pt{background:#7ec8ff}.rm .sp{background:#9be39b}
#ov{position:fixed;inset:0;background:#000a;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:26px;text-align:center;z-index:9}
.hide{display:none}
</style></head><body>
<div id="menu" class="card">
<h2 style="margin:0 0 6px">おかしな色塗りバトル</h2>
<p>モード<br>
<label><input type="radio" name="m" value="bot" checked>超高性能bot戦(あなたA vs bot2体)</label><br>
<label><input type="radio" name="m" value="local">対人・1台のスマホ</label><br>
<label><input type="radio" name="m" value="online">対人・オンライン(P2P)</label></p>
<p id="pn" class="hide">人数 <select id="np"><option value="2">2人(Cはbot)</option><option value="3">3人</option></select></p>
<p>マップ 横<select id="w"></select> × 縦<select id="h"></select></p>
<button id="go">スタート</button>
<div id="on" class="hide"><hr>
<p><b>ホスト(Aになります)</b>：人数と大きさを決めて<button id="host">部屋を作る</button></p>
<p><b>ゲスト</b>：部屋コード<input id="code" size="5" inputmode="numeric"><button id="join">参加</button></p>
<p id="st"></p></div></div>
<div id="game" class="hide">
<div id="hd" class="card"></div>
<div id="info" class="card" style="text-align:center"></div>
<div id="g"></div>
<details class="card"><summary>コマの使用状況</summary><div id="pan"></div></details>
<div id="tr"></div>
<details class="card"><summary>駒の範囲(黄=設置 赤=攻撃 青=塗り 緑=特殊)</summary><div id="rg"></div><p style="font-size:12px;margin:8px 0 0">🔒シールドマス(暗く表示)：相手の攻撃・塗り・ばにらを受けず、駒も倒されません。みるくで作り、相手のぷりんで解除されます。</p></details></div>
<div id="ov"><div id="ovt"></div><button onclick="location.reload()">もどる</button></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s),PN=['A','B','C'],COL=['#e8505b','#3b82f6','#2fae66'];
const PL=[['choco','ちょこ'],['purin','ぷりん'],['pan','ぱん'],['hime','ひめ'],['panpi','ぱんぴー'],['cookie','くっきー'],['vanilla','ばにら'],['milk','みるく'],['panna','ぱんな'],['ichigo','いちご']];
// 色塗り攻撃(敵駒を倒す)
const F={choco:[[0,-1],[0,1]],panpi:[[-1,-1],[-2,-2]],ichigo:[[-1,0],[1,0]],cookie:[[1,-1],[2,-2]]};
// 色塗り(敵駒は倒さない)
const Pp={pan:[[0,-1],[0,1],[-1,0],[1,0]],hime:[[-1,-1],[1,-1],[-1,1],[1,1]],purin:[[0,-1],[0,1]],panna:[[0,-1],[0,1]]};
const snd=n=>{const a=new Audio(n+'.wav');a.play().catch(()=>{})};
const bgm=new Audio('bgm.wav');bgm.loop=true;bgm.volume=.35;
for(let i=4;i<=12;i++){$('#w').add(new Option(i,i,i==6,i==6));$('#h').add(new Option(i,i,i==8,i==8))}
let pv=-1,S,mode='bot',me=1,sel=-1,peer,conns=[],cn,host=true,lastFx=0;
const mo=()=>document.querySelector('[name=m]:checked').value;
document.querySelectorAll('[name=m]').forEach(r=>r.onchange=()=>{const m=mo();$('#pn').classList.toggle('hide',m=='bot');$('#on').classList.toggle('hide',m!='online');$('#go').classList.toggle('hide',m=='online')});

function init(w,h,hm){S={w,H:h,c:Array.from({length:w*h},()=>({o:0,s:0,k:null,i:null})),rem:Array(10).fill(1),u:[0,0,0],t:1,rd:1,hm,fx:0,af:0,over:0,msg:''}}
const hmOf=n=>[1,1,1].map((_,i)=>i<n?1:0);
function begin(){bgm.play().catch(()=>{});$('#menu').classList.add('hide');$('#game').classList.remove('hide');render()}
$('#go').onclick=()=>{mode=mo();me=1;init(+$('#w').value,+$('#h').value,mode=='bot'?[1,0,0]:hmOf(+$('#np').value));begin()};

// ---- ルール ----
function tp(S,x,y,p,atk){if(x<0||y<0||x>=S.w||y>=S.H)return 0;const c=S.c[y*S.w+x];if(c.s&&c.o!=p)return 0;
 if(c.k!=null&&c.k!=p){if(!atk)return 0;c.k=null;c.i=null}c.o=p;return 1}
function place(S,i,id,p){const x=i%S.w,y=i/S.w|0,c=S.c[i],own=c.o==p;c.o=p;c.k=p;c.i=id;let f=0;
 (F[id]||[]).forEach(d=>f+=tp(S,x+d[0],y+d[1],p,1));
 (Pp[id]||[]).forEach(d=>tp(S,x+d[0],y+d[1],p,0));
 if(id=='milk'&&own)c.s=1;
 if(id=='purin'||id=='vanilla')for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
  const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=S.w||Y>=S.H||(!dx&&!dy))continue;const n=S.c[Y*S.w+X];
  if(id=='purin'&&n.s&&n.o&&n.o!=p){n.s=0;f=1}
  if(id=='vanilla'&&n.o&&n.o!=p&&!n.s&&n.k==null){n.o=p;f=1}}
 return f}
// ぱんなだけは相手の色のマス(シールドなし・駒なし)にも置ける
const ok=(S,i,p,id)=>{const c=S.c[i];return c.k==null&&(!c.o||c.o==p||id=='panna'&&!c.s)};
const canMove=(S,p)=>S.c.some((_,i)=>ok(S,i,p)||S.rem[8]&&ok(S,i,p,'panna'));
const cnt=(S,p)=>S.c.filter(c=>c.o==p).length;
function adv(S){if(!S.rem.some(x=>x)){S.rd++;S.rem.fill(1);S.u=[0,0,0]}
 if(S.rd>7||S.c.every(c=>c.o)){S.over=1;return}
 for(let k=1;k<=3;k++){const t=(S.t-1+k)%3+1;if(canMove(S,t)){S.t=t;return}}S.over=1}
function act(i,pi,who){if(S.over||!S.rem[pi]||!ok(S,i,S.t,PL[pi][0])||!S.hm[S.t-1]&&who!=='bot'||who!=='bot'&&who!==S.t)return;
 const id=PL[pi][0];S.af=place(S,i,id,S.t);S.msg=id=='milk'&&S.c[i].s?'🔒 シールド発動！':id=='purin'&&S.af?'🔓 シールド解除！':'';
 S.rem[pi]=0;S.u[S.t-1]++;S.fx++;adv(S);sync()}
function sync(){conns.forEach(c=>c.open&&c.send({t:'s',S}));render();sfx();kick()}
function sfx(){if(S.fx!=lastFx){lastFx=S.fx;snd('setti');if(S.af)setTimeout(()=>snd('attack'),150)}}
function kick(){if(host&&!S.over&&!S.hm[S.t-1])setTimeout(bot,900)}
function ev(T,p){let v=0;T.c.forEach(c=>{if(c.o==p)v+=1+(c.s?.7:0)+(c.k==p?.1:0);else if(c.o)v-=.5+(c.s?.35:0)});return v}
function bot(){if(S.over||S.hm[S.t-1])return;const p=S.t;let b=-1e9,bi,bp;
 S.c.forEach((c,i)=>{S.rem.forEach((r,pi)=>{if(!r||!ok(S,i,p,PL[pi][0]))return;
  const T={...S,c:S.c.map(q=>({...q}))};place(T,i,PL[pi][0],p);const v=ev(T,p)+Math.random()*.3;if(v>b){b=v;bi=i;bp=pi}})});
 act(bi,bp,'bot')}

// ---- 範囲パネル ----
const SP={purin:'8近傍の相手シールド解除+上下を塗る(敵駒は倒さない)',panna:'相手の色のマスにも置ける・上下を塗る(敵駒は倒さない)',vanilla:'3x3の敵色のみ自色に',milk:'自色マスに置くとシールド'};
$('#rg').innerHTML=PL.map(([id,n])=>{let h='';for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++){let c='',t='';
 if(!x&&!y){c='me';t=id=='milk'?'盾?':'●'}
 else if((F[id]||[]).some(d=>d[0]==x&&d[1]==y))c='at';
 else if((Pp[id]||[]).some(d=>d[0]==x&&d[1]==y))c='pt';
 else if((id=='purin'||id=='vanilla')&&Math.abs(x)<2&&Math.abs(y)<2)c='sp';
 h+=`<i class="${c}">${t}</i>`}
 return `<div class="rb"><b>${n}</b><div class="rm">${h}</div>${SP[id]||(F[id]?'攻撃(敵駒を倒す)':'塗り(敵駒は倒さない)')}</div>`}).join('');
// ---- 画面 ----
const mine=()=>S.hm[S.t-1]&&(mode=='local'||me==S.t);
function prev(){if(pv<0||sel<0)return null;const T={...S,c:S.c.map(q=>({...q}))};place(T,pv,PL[sel][0],S.t);return T}
function tap(i){if(!S||S.over||sel<0||!mine()||!ok(S,i,S.t,PL[sel][0]))return;
 if(pv==i){const p=sel;pv=-1;sel=-1;if(host)act(i,p,S.t);else{cn.send({t:'p',i,p});render()}return}
 pv=i;render()}
function render(){if(!S)return;
 if(!mine()||S.over||(sel>=0&&!S.rem[sel]))sel=-1;if(sel<0||(pv>=0&&!ok(S,pv,S.t,PL[sel][0])))pv=-1;
 const T=prev(),B=T||S;let pt='';
 if(T){const p=S.t,gain=cnt(T,p)-cnt(S,p),lost=[1,2,3].filter(q=>q!=p).map(q=>[q,cnt(S,q)-cnt(T,q)]).filter(a=>a[1]>0).map(a=>PN[a[0]-1]+'-'+a[1]).join(' '),
  kill=S.c.filter((c,i)=>c.k!=null&&c.k!=p&&T.c[i].k==null).length,sn=T.c.filter((c,i)=>c.s&&!S.c[i].s).length,sr=S.c.filter((c,i)=>c.s&&!T.c[i].s).length;
  pt=`👁 プレビュー：${PL[sel][1]}<br>自分 +${gain}マス${lost?' / 相手 '+lost:''}${kill?' / 駒撃破 '+kill:''}${sn?' / 🔒盾 +'+sn:''}${sr?' / 🔓解除 '+sr:''}<br><small>同じマスをもう一度タップで配置・別のマスや駒を選ぶと変更</small>`}
 $('#hd').innerHTML=[1,2,3].map(p=>`<div class="chip ${S.t==p?'on':''}" style="background:${COL[p-1]}">${PN[p-1]}${S.hm[p-1]?'':'🤖'}${mode!='local'&&me==p&&S.hm[p-1]?'(あなた)':''}<br>${cnt(S,p)}マス</div>`).join('');
 $('#info').innerHTML=`第${Math.min(S.rd,7)}週/7 ・ 残りコマ ${S.rem.filter(x=>x).length}/10<br><b style="color:${COL[S.t-1]}">${PN[S.t-1]}の番</b>${T?'<br>'+pt:mine()?'：コマを選んでマスをタップ'+(sel==7?'<br><small>金枠＝自分の色のマス(ここに置くとシールド)</small>':''):''}${!T&&S.msg?'<br>'+S.msg:''}`;
 const g=$('#g');g.style.gridTemplateColumns=`repeat(${S.w},1fr)`;
 g.innerHTML=B.c.map((c,i)=>{const z=S.c[i];return `<div class="c ${c.s?'sh':''} ${T?(i==pv?'pvc':c.o!=z.o||c.s!=z.s||c.k!=z.k?'ch':''):mine()&&sel>=0&&ok(S,i,S.t,PL[sel][0])?(sel==7&&c.o==S.t?'v2':'v'):''}" data-i="${i}" style="background:${c.o?COL[c.o-1]:'#f1f1f1'}">${c.k!=null?`<img class="p" src="${c.i}.png" alt="${PL.find(q=>q[0]==c.i)[1]}" onerror="this.outerHTML='<span>'+this.alt+'</span>'"><b style="background:${COL[c.k-1]}">${PN[c.k-1]}</b>`:''}${c.s?`<img class="lk" src="look.png" onerror="this.outerHTML='<span class=lt>🔒</span>'">`:''}</div>`}).join('');
 $('#tr').innerHTML=PL.map((q,i)=>`<button class="pc ${S.rem[i]?'':'used'} ${sel==i?'sel':''}" data-p="${i}"><img src="${q[0]}.png" alt="" onerror="this.remove()"><br>${q[1]}</button>`).join('');
 $('#pan').innerHTML=`今週の残り：${S.rem.map((r,i)=>r?PL[i][1]:'').filter(x=>x).join('、')||'なし'}<br>今週の使用回数：`+[1,2,3].map(p=>`<span style="color:${COL[p-1]}">${PN[p-1]} ${S.u[p-1]}回</span>`).join(' ')+'<br>※コマは全員で共有・1週に各1回';
 if(S.over){const n=[1,2,3].map(p=>cnt(S,p)),m=Math.max(...n),w=n.map((v,i)=>v==m?PN[i]:'').join('');
  $('#ovt').innerHTML=`終了！<br>${w.length>1?'引き分け '+w:'勝者 '+w+'チーム'}<br><small>A:${n[0]} B:${n[1]} C:${n[2]}</small>`;$('#ov').style.display='flex'}}
$('#g').onclick=e=>{const c=e.target.closest('.c');if(c)tap(+c.dataset.i)};
$('#tr').onclick=e=>{const b=e.target.closest('.pc');if(b&&S&&mine()&&S.rem[+b.dataset.p]){const n=+b.dataset.p;if(sel==n){sel=-1;pv=-1}else sel=n;render()}};

// ---- オンライン(PeerJS / P2P) ----
$('#host').onclick=()=>{mode='online';host=true;me=1;const n=+$('#np').value,code=String(1000+Math.random()*9000|0);
 init(+$('#w').value,+$('#h').value,hmOf(n));$('#st').textContent=`部屋コード【${code}】 待機中… (ゲスト${n-1}人)`;
 peer=new Peer('ccb'+code);
 peer.on('connection',c=>{if(conns.length>=n-1)return;conns.push(c);const id=conns.length;
  c.on('open',()=>{c.send({t:'y',me:id+1});if(conns.length==n-1)setTimeout(()=>{begin();sync()},300)});
  c.on('data',m=>{if(m.t=='p')act(m.i,m.p,id+1)})});
 peer.on('error',e=>$('#st').textContent='エラー:'+e.type)};
$('#join').onclick=()=>{mode='online';host=false;peer=new Peer();
 peer.on('open',()=>{cn=peer.connect('ccb'+$('#code').value.trim());$('#st').textContent='接続中…';
  cn.on('data',m=>{if(m.t=='y'){me=m.me;$('#st').textContent='ホストの開始待ち'}
   if(m.t=='s'){if(!S)begin();S=m.S;render();sfx()}})});
 peer.on('error',e=>$('#st').textContent='エラー:'+e.type)};
</script></body></html>
